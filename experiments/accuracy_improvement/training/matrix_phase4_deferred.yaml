# Deferred Phase 4 ablations (deadline re-plan 2026-11-22).
defaults:
  weights: models/pretrained/yolo26m.pt
  data: experiments/accuracy_improvement/datasets/v1_original_labels/dev.yaml
  imgsz: 640
  batch: 4
  epochs: 30
  patience: 15
  seed: 42
  fraction: 1.0
  evaluate: true
  fixed: YOLO26m architecture and pretrained weights; train/dev split v1; AdamW auto (lr0 0.000625); nominal batch 64; seed 42; Ultralytics 8.4.215 defaults
    except the changed variable
experiments:
- name: E6_m640_tiles
  data: experiments/accuracy_improvement/datasets/v2_train_tiles/dev.yaml
  hypothesis: Adding 962 native-resolution tiles cut from training images with tiny missing-PPE boxes teaches the model those objects at a larger apparent
    scale without changing the inference size
  changed:
  - 'training data: + 962 training-derived tiles (v2_train_tiles); inference unchanged at 640'
  expected: Better small-object recall at 640, possibly fewer false negatives on source-family scenes; about 2.5x training time per epoch; risk of more
    false positives from clipped partial objects
  success: Dev small-object and missing-PPE recall above E1 without a precision drop larger than the recall gain
- name: E2_m640_long
  epochs: 60
  patience: 15
  hypothesis: The earlier 30-epoch curve had not plateaued (REPORT-014); a longer schedule with early stopping and best-checkpoint retention (selected on
    dev) improves the result
  changed:
  - epochs 30 -> 60 (patience 15, best.pt by dev fitness)
  expected: Higher dev mAP50-95 until early stopping; about 2x training time
  success: Dev metrics above E1; best epoch recorded
